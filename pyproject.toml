[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-backend"
version = "0.1.0"
description = "Backend y workers de Quinisindic para scraping, sync y API FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "supabase>=2.27.2",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "ruff>=0.13.0",
]

[project.scripts]
api = "app.cli:api_main"
api-dev = "app.cli:api_dev_main"
check = "app.cli:check_entry"
test = "app.cli:test_entry"
bootstrap-football = "app.cli:bootstrap_football_entry"
worker-football-live = "app.cli:worker_football_live_entry"
worker-football-post-match = "app.cli:worker_football_post_match_entry"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
